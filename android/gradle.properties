# 16GB 맥: 데몬 하나가 8G까지 커져 여러 개 뜨면 스왑 스래싱(2026-11-10 실측 6개 13.2GB) · 2G는 릴리스 Jetifier에서 Java heap space(2026-11-19) → 4G
# HeapDumpOnOutOfMemoryError는 뺐다(2026-11-19): OOM마다 android/java_pid*.hprof로 2.5GB씩 쏟아
# 디스크가 꽉 찼다(이날 2개 4.7GB 발견). 원인은 이미 밝혀져 덤프가 필요 없다.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
# 30분 놀면 데몬이 스스로 종료 (기본 3시간)
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
android.enableJetifier=true
